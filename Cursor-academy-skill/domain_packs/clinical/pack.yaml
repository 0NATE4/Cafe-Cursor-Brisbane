pack_name: clinical
version: 1.0.0
description: "Clinical domain pack adding CONSORT, STROBE, and AMA citation standards for RCTs and observational studies."
applicable_modes: [full, integrity]
checklists:
  - id: consort-2010
    name: "CONSORT 2010 RCT Checklist"
    path: references/consort_2010_checklist.md
    stage_gate: 4.5
  - id: strobe-2010
    name: "STROBE Observational Study Checklist"
    path: references/strobe_checklist.md
    stage_gate: 4.5
agents:
  - name: clinical_compliance_agent
    prompt: "Verify trial registration numbers, primary outcome metrics, and clinical safety profiles against registered clinicaltrials.gov metadata."
schemas:
  - name: trial_registration.schema.json

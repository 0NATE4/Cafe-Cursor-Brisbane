name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # Legacy Pages deploys from main/ (source). Publish the Vite build at repo root
      # so the site loads bundled JS instead of raw /src/main.tsx.
      - name: Publish build artifacts to main
        run: |
          cp dist/index.html index.html
          cp dist/404.html 404.html
          rm -rf assets
          cp -r dist/assets assets

      - name: Commit and push built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets
          if git diff --staged --quiet; then
            echo "No built artifact changes to commit."
          else
            git commit -m "chore: update GitHub Pages build artifacts"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Prefer GitHub Actions as Pages source
        continue-on-error: true
        run: gh api "repos/${{ github.repository }}/pages" -X PUT -f build_type=workflow
        env:
          GH_TOKEN: ${{ github.token }}
